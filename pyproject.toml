[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv-monitor"
version = "0.1.0"
description = "Live CCTV person, phone-use, and zone-leave monitoring system"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "opencv-python==4.10.0.84",
  "ultralytics==8.3.40",
  "numpy==2.1.3"
]

[tool.setuptools]
packages = ["cctv_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

